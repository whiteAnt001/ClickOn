<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title th:text="${categoryName} + ' 상품 목록'">카테고리</title>
    <link rel="stylesheet" href="/css/category.css" />
    <link rel="stylesheet" href="/css/include.css" />
    <link href="https://fonts.googleapis.com/css2?family=Pretendard&display=swap" rel="stylesheet" />
</head>
<body>

<!-- 헤더 -->
<div th:replace="include/header :: header"></div>

<!-- 카테고리 타이틀 -->
<section class="category-section">
    <h2 class="category-title" th:text="${categoryName} + ' 카테고리'">카테고리명</h2>

    <!-- 상품 목록 -->
    <div class="product-grid">
        <div class="product-card" th:each="product : ${products}">
            <img th:src="@{${product.imageUrl}}" alt="상품 이미지" />
            <div class="product-info">
                <div class="product-name" th:text="${product.name}">상품명</div>
                <div class="product-price" th:text="${#numbers.formatInteger(product.price, 3, 'COMMA')} + '원'">가격</div>
            </div>
        </div>
    </div>
</section>

<!-- 푸터 -->
<div th:replace="include/footer :: footer"></div>

</body>
</html>
