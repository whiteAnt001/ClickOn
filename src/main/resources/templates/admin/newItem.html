<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>상품 등록</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Pretendard&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Pretendard', sans-serif;
      background-color: #f8f9fa;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .form-section {
      width: 100%;
      max-width: 720px;
      background-color: white;
      padding: 40px 30px;
      border-radius: 16px;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.08);
    }
    h2 {
      margin-bottom: 30px;
      font-weight: 700;
      text-align: center;
    }
    .form-label {
      font-weight: 500;
    }
    .btn-primary {
      background-color: #4A90E2;
      border: none;
    }
    .btn-primary:hover {
      background-color: #357ABD;
    }
  </style>
</head>
<body>

<div class="form-section">
  <h2>🛍️ 상품 등록</h2>

  <form id="itemForm" enctype="multipart/form-data">
    <div class="mb-3">
      <label for="name" class="form-label">상품명</label>
      <input type="text" class="form-control" id="name" name="name" placeholder="예: 키보드 A87" required>
    </div>

    <div class="mb-3">
      <label for="price" class="form-label">가격 (₩)</label>
      <input type="number" class="form-control" id="price" name="price" placeholder="예: 89000" required>
    </div>

    <div class="mb-3">
      <label for="stock" class="form-label">재고 수량</label>
      <input type="number" class="form-control" id="stock" name="stock" required>
    </div>

    <div class="mb-3">
      <label for="category" class="form-label">카테고리</label>
      <select class="form-select" id="category" name="category" required>
        <option value="">선택하세요</option>
        <option>키보드</option>
        <option>마우스</option>
        <option>커스텀</option>
        <option>악세사리</option>
      </select>
    </div>

    <div class="mb-3">
      <label for="discount" class="form-label">할인율 (%)</label>
      <input type="text" class="form-control" id="discount" name="discount" placeholder="예: 10">
    </div>

    <div class="mb-3">
      <label for="image" class="form-label">대표 이미지</label>
      <input type="file" name="imageFile" class="form-control" id="image" accept="image/*">
    </div>

    <div class="mb-3">
      <label for="description" class="form-label">상품 설명</label>
      <textarea class="form-control" id="description" name="description" rows="4" placeholder="상품에 대한 상세 정보를 입력하세요"></textarea>
    </div>

    <div class="d-grid">
      <button type="button" class="btn btn-primary btn-lg" onclick="submitItem()">상품 등록</button>
    </div>
  </form>
</div>

<!-- JS 파일 연결 -->
<script src="/js/item.js"></script>

</body>
</html>
