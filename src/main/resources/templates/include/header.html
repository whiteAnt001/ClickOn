<div th:fragment="header">
    <header class="site-header">
        <link rel="stylesheet" href="/css/include.css" />
        <div class="header-container">
            <!-- 왼쪽: 사이트 이름 -->
            <h1 class="site-title">
                <a th:href="@{/}">CLICK ON</a>
            </h1>

            <!-- 오른쪽: 로그인/드롭다운/장바구니 -->
            <div class="right-area">
                <th:block th:if="${isLoggedIn}">
                    <!-- 사용자 드롭다운 -->
                    <div class="user-dropdown">
                        <div class="user-dropdown-toggle" role="button" tabindex="0" aria-haspopup="true" aria-expanded="false">
                            <svg width="16" height="16" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.5 20.25a8.25 8.25 0 0115 0"></path>
                            </svg>
                            <span th:text="${loginUser.name}">사용자이름</span>
                        </div>
                        <div class="user-dropdown-menu" role="menu" aria-label="사용자 메뉴">
                            <a th:href="@{/mypage}" role="menuitem">마이페이지</a>
                            <a th:href="@{/order/list}" role="menuitem">주문내역</a>
                            <a href="#" id="logout-btn" role="menuitem">로그아웃</a>
                        </div>
                    </div>

                    <!-- 장바구니 -->
                    <div class="cart-icon-wrapper">
                        <a th:href="@{/cart}" aria-label="장바구니">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="9" cy="21" r="1"></circle>
                                <circle cx="20" cy="21" r="1"></circle>
                                <path d="M1 1h4l2.68 13.39a2 2 0 002 1.61h9.72a2 2 0 001.95-1.54l1.38-7.81H6"></path>
                            </svg>
                            <span class="cart-count" th:text="${cartItemCount}">0</span>
                        </a>
                    </div>
                </th:block>

                <th:block th:if="${!isLoggedIn}">
                    <a href="/login" class="login-link">로그인 / 회원가입</a>
                </th:block>
            </div>
        </div>
    </header>

    <script th:inline="javascript">
        /*<![CDATA[*/
        document.addEventListener('DOMContentLoaded', function () {
            const dropdownToggle = document.querySelector('.user-dropdown-toggle');
            const dropdown = dropdownToggle?.closest('.user-dropdown');

            if (!dropdownToggle || !dropdown) return;

            function closeDropdown() {
                dropdown.classList.remove('active');
                dropdownToggle.setAttribute('aria-expanded', 'false');
            }

            function toggleDropdown() {
                const isActive = dropdown.classList.contains('active');
                dropdown.classList.toggle('active', !isActive);
                dropdownToggle.setAttribute('aria-expanded', String(!isActive));
            }

            dropdownToggle.addEventListener('click', (e) => {
                e.stopPropagation();
                toggleDropdown();
            });

            document.addEventListener('click', (e) => {
                if (!dropdown.contains(e.target)) {
                    closeDropdown();
                }
            });
        });
        /*]]>*/
    </script>
    <script src="/js/auth.js"></script>
</div>
