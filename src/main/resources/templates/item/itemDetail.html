<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>상품 상세</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <th:block th:replace="include/bootstrap :: bootstrap"/>
    <link rel="stylesheet" href="/css/include.css" />
    <link rel="stylesheet" href="/css/itemDetail.css">
</head>
<body>

<!-- 헤더 include -->
<div th:replace="include/header :: header"></div>

<!-- 상품 상세 -->
<div class="container">
    <div class="product-detail row">
        <!-- 이미지 -->
        <div class="col-md-6 p-4">
            <img th:src="@{/images/{img}(img=${item.imageName})}" alt="상품 이미지" class="product-img w-100 h-100" />
        </div>

        <!-- 정보 -->
        <div class="col-md-6 product-info">
            <div class="product-title d-flex justify-content-between align-items-center">
                <span th:text="${item.name}">상품 이름</span>
                <button class="btn btn-outline-danger btn-sm" id="likeButton">
                    <i class="bi bi-heart" id="heartIcon"></i>
                </button>
            </div>
            <div class="product-price text-end" th:text="'₩' + ${formattedPrice}">₩99,000</div>
            <div class="product-desc" th:text="'재고수량 : ' + ${item.stock}">삼품 재고 수량이 여기 들어갑니다.</div>

            <!-- 장바구니 버튼 -->
            <div class="mt-4 d-flex gap-2">
                <button id="addToCartBtn" class="btn btn-cart btn-lg flex-grow-1 text-center" th:data-item-id="${item.idx}" data-quantity="1">🛒 장바구니</button>
                <button class="btn btn-cart btn-lg flex-grow-1 text-center">💳 바로구매</button>
            </div>
        </div>
    </div>
</div>

<!-- 탭 영역 -->
<div class="tab-wrapper mt-5 mb-5">
    <ul class="nav nav-tabs" id="detailTabs" role="tablist">
        <li class="nav-item" role="presentation">
            <button class="nav-link active" id="desc-tab" data-bs-toggle="tab" data-bs-target="#desc"
                    type="button" role="tab" aria-controls="desc" aria-selected="true">상세설명</button>
        </li>
        <li class="nav-item" role="presentation">
            <button class="nav-link" id="review-tab" data-bs-toggle="tab" data-bs-target="#review"
                    type="button" role="tab" aria-controls="review" aria-selected="false">리뷰</button>
        </li>
        <li class="nav-item" role="presentation">
            <button class="nav-link" id="qna-tab" data-bs-toggle="tab" data-bs-target="#qna"
                    type="button" role="tab" aria-controls="qna" aria-selected="false">문의</button>
        </li>
        <li class="nav-item" role="presentation">
            <button class="nav-link" id="delivery-tab" data-bs-toggle="tab" data-bs-target="#delivery"
                    type="button" role="tab" aria-controls="delivery" aria-selected="false">배송정보</button>
        </li>
    </ul>
    <div class="tab-content p-4 border border-top-0 bg-white shadow-sm" id="detailTabsContent">
        <div class="tab-pane fade show active" id="desc" role="tabpanel" aria-labelledby="desc-tab">
            <p th:text="${item.description}">이곳에 상품에 대한 자세한 설명을 입력해주세요.</p>
        </div>
        <div class="tab-pane fade" id="review" role="tabpanel" aria-labelledby="review-tab">
            <p>아직 등록된 리뷰가 없습니다.</p>
        </div>
        <div class="tab-pane fade" id="qna" role="tabpanel" aria-labelledby="qna-tab">
            <p>아직 등록된 문의사항이 없습니다.</p>
            <button type="button" class="btn btn-primary">문의 작성</button>
        </div>
        <div class="tab-pane fade" id="delivery" role="tabpanel" aria-labelledby="delivery-tab">
            <p>🚚 기본 배송: 2~3일 소요<br/>
                📦 교환/반품: 수령 후 7일 이내 가능<br/>
                ❗ 고객센터: 1234-5678</p>
        </div>
    </div>
</div>

<!-- 푸터 include -->
<div th:replace="include/footer :: footer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/item.js"></script>
<!-- 탭 영역 변경 스크립트 -->
</body>
</html>
