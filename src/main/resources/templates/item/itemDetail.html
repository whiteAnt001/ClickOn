<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>상품 상세</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Pretendard&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/include.css" />
    <style>
        body {
            font-family: 'Pretendard', sans-serif;
            background-color: #f8f9fa;
        }
        .product-detail {
            max-width: 900px;
            margin: 50px auto;
            background-color: #fff;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
            overflow: hidden;
        }
        .product-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 12px;
        }
        .product-info {
            padding: 30px;
        }
        .product-title {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 15px;
        }
        .product-price {
            font-size: 22px;
            color: #e94e4e;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .product-desc {
            font-size: 16px;
            color: #555;
            margin-bottom: 30px;
        }
        .tag {
            display: inline-block;
            background-color: #e2e6ea;
            color: #333;
            padding: 5px 12px;
            border-radius: 50px;
            font-size: 13px;
            margin-right: 6px;
        }
        .btn-cart {
            background-color: #4A90E2;
            border: none;
        }
        .btn-cart:hover {
            background-color: #357ABD;
        }
    </style>
</head>
<body>

<!-- 헤더 include -->
<div th:replace="include/header :: header"></div>

<div class="container">
    <div class="product-detail row">
        <!-- 이미지 영역 -->
        <div class="col-md-6 p-4">
            <img th:src="@{/images/{img}(img=${item.imageName})}" alt="상품 이미지" class="product-img w-100 h-100" />
        </div>

        <!-- 정보 영역 -->
        <div class="col-md-6 product-info">
            <div class="product-title" th:text="${item.name}">상품 이름</div>
            <div class="product-price" th:text="'₩' + ${item.price}">₩99,000</div>
            <div class="product-desc" th:text="${item.description}">상품에 대한 설명이 여기에 들어갑니다.</div>


            <!-- 버튼 -->
            <div class="mt-4">
                <button class="btn btn-cart btn-lg w-100">🛒 장바구니에 담기</button>
            </div>
        </div>
    </div>
</div>

<!-- 푸터 include -->
<div th:replace="include/footer :: footer"></div>

</body>
</html>
